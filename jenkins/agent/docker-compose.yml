version: "3.8"

services:
  jenkins-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: jenkins-runner:latest
    container_name: jenkins-runner
    restart: unless-stopped
    volumes:
      - ./agent_home:/home/jenkins
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - jenkins
    command:
      - "-url"
      - "http://192.168.100.56:83/"
      - "-secret"
      - "${JENKINS_AGENT_SECRET}"
      - "-name"
      - "docker-agent"
      - "-webSocket"
      - "-workDir"
      - "/home/jenkins"

networks:
  jenkins:
    driver: bridge
