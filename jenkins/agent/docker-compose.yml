version: "3.8"

services:
  jenkins-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: jenkins-runner:latest
    container_name: jenkins-runner
    restart: unless-stopped
    environment:
      - JENKINS_URL=http://192.168.100.56:83
      - JENKINS_AGENT_NAME=docker-agent
      - JENKINS_SECRET=${JENKINS_AGENT_SECRET}
    volumes:
      - ./agent_home:/home/jenkins
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - jenkins
    command: [ "-url", "http://192.168.100.56:83", "${JENKINS_AGENT_SECRET}", "docker-agent" ]

networks:
  jenkins:
    driver: bridge
