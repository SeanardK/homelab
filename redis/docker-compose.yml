version: '3.8'

name: redis_prod

services:
  redis_prod:
    env_file:
      - .env
    image: redis:7-alpine
    container_name: redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_prod_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - redis_prod_network

volumes:
  redis_prod_data:


networks:
  redis_prod_network:
    name: redis_prod_network
    driver: bridge
