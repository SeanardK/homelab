version: '3.8'

name: mongodb_dev

services:
  mongo:
    image: mongo:6.0
    container_name: mongo_dev
    env_file:
      - .env.dev
    volumes:
      - mongo_dev_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - mongodb_dev_network

volumes:
  mongo_dev_data:


networks:
  mongodb_dev_network:
    driver: bridge
