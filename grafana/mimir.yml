target: all

server:
  http_listen_port: 9009

multitenancy_enabled: false

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/alertmanager

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/ruler

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1