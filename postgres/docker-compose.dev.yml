version: '3.8'

name: postgres_dev

services:
  postgres:
    env_file:
      - .env.dev
    image: postgres:16
    container_name: postgres_dev
    restart: unless-stopped
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - postgres_dev_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_dev_data:


networks:
  postgres_dev_network:
    driver: bridge
